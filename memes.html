<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{

    height:100vh;
    display:flex;

    background:#e8d9d9;
    font-family:Arial, sans-serif;
}

.card{
    background:rgb(191, 138, 138);
    padding:20px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(34, 30, 30, 0.2);
    text-align:center;
    width:420px;
    
}

img{
    width:100%;
    border-radius:15px;
    transition: transform 0.5s ease;
   
}
img:hover{
    transform: scale(1.1);
}

h2{
    margin-bottom:15px;
    font-size:24px;
}

p{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>
<div class="card">
    <!-- <h2>🐱 Programmer Cat</h2> -->

    
    <img src="cat.jpeg" alt="Cat">

    <p>
        Me: "I'll fix this bug in 5 minutes."<br>
        Also me 6 hours later: 😭
    </p>
</div>

</body>
</html>
