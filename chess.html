<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
*{
        margin:0px;
        box-sizing: border-box;
        padding:0px;
       
    }
     body {
      height: 100vh;                
      display: flex;                
      justify-content: center;       
      align-items: center;           
      background-color: lightgray;
    }
        .c1{
            width:200px;
            height:200px;
            border:2px solid black;
            display:grid;
            
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(4,1fr);
             
        }
        .c2a{
            width:50px;
            height:50px;
            border:2px solid black;
            background-color: black;
          
        }
        .c2{
            width:50px;
            height:50px;
            border:2px solid black;
            
        }
    </style>
</head>
<body>
     <div class="c1">
            <div class="c2a">1</div>
            <div class="c2">2</div>
            <div class="c2a">3</div>
            <div class="c2">4</div>
            <div class="c2">5</div>
            <div class="c2a">6</div>
            <div class="c2">7</div>
            <div class="c2a">8</div>
            <div class="c2a">9</div>
            <div class="c2">10</div>
            <div class="c2a">11</div>
            <div class="c2">12</div>
            <div class="c2">13</div>
            <div class="c2a">14</div>
            <div class="c2">15</div>
            <div class="c2a">16</div>
        </div>




</body>
</html>
